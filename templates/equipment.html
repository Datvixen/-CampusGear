{% extends "base.html" %}{% block content %}<div class="heading"><div><label>INVENTORY</label><h1>Equipment</h1><p>Search, filter, and manage campus assets.</p></div><a class="btn primary" href="/equipment/add">+ Add Equipment</a></div><form class="filters"><input name="search" value="{{search}}" placeholder="Search name, asset tag, serial"><select name="category"><option value="">All Categories</option>{% for x in categories %}<option {% if category==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><select name="condition"><option value="">All Conditions</option>{% for x in conditions %}<option {% if condition==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><select name="location"><option value="">All Locations</option>{% for x in locations %}<option {% if location==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><button class="btn">Filter</button></form><div class="card"><table><tr><th>Equipment</th><th>Category</th><th>Qty</th><th>Condition</th><th>Location</th><th>Actions</th></tr>{% for x in items %}<tr><td><b>{{x.name}}</b><small>{{x.asset_tag}}</small></td><td>{{x.category}}</td><td>{{x.quantity}}</td><td><span class="badge">{{x.condition}}</span></td><td>{{x.location}}</td><td><a href="/equipment/{{x.id}}/edit">Edit</a> <form class="inline" method="post" action="/equipment/{{x.id}}/delete"><button class="delete">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
