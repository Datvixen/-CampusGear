{% extends "base.html" %}{% block content %}<div class="heading"><div><label>INVENTORY</label><h1>{{"Edit" if item else "Add"}} Equipment</h1><p>Enter the campus asset information.</p></div></div><div class="card form"><form method="post" class="grid"><label>Asset Tag<input required name="asset_tag" value="{{item.asset_tag if item else ''}}" placeholder="CG-1006"></label><label>Equipment Name<input required name="name" value="{{item.name if item else ''}}"></label><label>Category<select name="category">{% for x in categories %}<option {% if item and item.category==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Serial Number<input name="serial_number" value="{{item.serial_number if item else ''}}"></label><label>Quantity<input type="number" min="1" required name="quantity" value="{{item.quantity if item else 1}}"></label><label>Condition<select name="condition">{% for x in conditions %}<option {% if item and item.condition==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Location<select name="location">{% for x in locations %}<option {% if item and item.location==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label class="wide">Notes<textarea name="notes">{{item.notes if item else ''}}</textarea></label><div class="wide"><button class="btn primary">Save Equipment</button></div></form></div>{% endblock %}
